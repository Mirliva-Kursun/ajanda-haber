name: Haberleri çek
on:
  schedule:
    - cron: "7 */3 * * *"   # 3 saatte bir (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - name: Değiştiyse kaydet
        run: |
          git config user.name "ajanda-bot"
          git config user.email "ajanda-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Haberler $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
          git push
